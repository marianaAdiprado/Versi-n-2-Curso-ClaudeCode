<!doctype html><html lang="es"><head><title>Tu postulación</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@600&display=swap"><link rel="stylesheet" href="/style.css"></head><body><main><h1 id="h">Tu postulación</h1><div id="v" class="card">Cargando…</div></main>
<script>
const t=new URLSearchParams(location.search).get('t'),v=document.getElementById('v'),D={cv:'Currículum vitae actualizado',constancia:'Constancia de situación fiscal actualizada',titulo:'Título de maestría',cedula:'Cédula profesional de maestría'};
const api=(body)=>fetch('/api/candidate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t,...body})}).then(async r=>({ok:r.ok,d:await r.json()}));
const fmt=s=>new Date(s).toLocaleString('es-MX',{timeZone:'America/Mexico_City',dateStyle:'full',timeStyle:'short'});
async function load(){const r=await fetch('/api/candidate?t='+t);const c=await r.json();
 if(!r.ok){v.innerHTML='<p class="err">'+c.error+'</p>';return}
 document.getElementById('h').textContent='Hola, '+c.nombre;const s=c.status;
 if(s==='docs_pendientes'||s==='correccion_solicitada'){
  v.innerHTML=(s==='correccion_solicitada'?'<p class="err">Corrección solicitada: '+c.motivo+'</p>':'<p>Sube los cuatro documentos en PDF (máximo 10 MB cada uno). Todos son obligatorios.</p>')+
  Object.entries(D).map(([k,n])=>'<label for="'+k+'">'+n+'</label><input type="file" id="'+k+'" accept="application/pdf">').join('')+'<p id="m" class="err" role="alert"></p><button id="up">Enviar documentos</button>';
  document.getElementById('up').onclick=upload}
 else if(s==='en_revision')v.innerHTML='<h2>Recibimos tus documentos</h2><p>La coordinación académica los revisará en un máximo de 3 días hábiles. Te avisaremos por correo.</p>';
 else if(s==='validado'){v.innerHTML='<h2>Agenda tu entrevista</h2><p class="muted">Horarios en hora de Ciudad de México.</p><div id="sl"></div><p id="m" class="err" role="alert"></p>';
  const g={};c.libres.forEach(x=>(g[x.slice(0,10)]??=[]).push(x));
  document.getElementById('sl').innerHTML=Object.entries(g).map(([d,a])=>'<h3>'+fmt(d+'T12:00:00-06:00').split(',').slice(0,2).join(',')+'</h3><div class="slots">'+a.map(x=>'<button class="alt" data-s="'+x+'">'+x.slice(11,16)+'</button>').join('')+'</div>').join('');
  v.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const r=await api({action:'book',slot:b.dataset.s});r.ok?load():document.getElementById('m').textContent=r.d.error})}
 else if(s==='entrevista_agendada')v.innerHTML='<h2>Entrevista agendada</h2><p>'+fmt(c.slot)+' (hora CDMX).</p><p>'+(c.meet_link?'Enlace de Meet: <a href="'+c.meet_link+'">'+c.meet_link+'</a>':'Te enviaremos el enlace de Meet por correo.')+'</p>';
 else v.innerHTML='<h2>Gracias por participar</h2><p>Tu proceso está en revisión por la coordinación. Si hay novedades, te escribiremos por correo.</p>'}
async function upload(){const m=document.getElementById('m');m.textContent='';const fs={};
 for(const k in D){const f=document.getElementById(k).files[0];if(!f||f.type!=='application/pdf'||f.size>10485760){m.textContent='Falta o no es válido: '+D[k]+' (PDF, máx. 10 MB).';return}fs[k]=f}
 document.getElementById('up').disabled=true;const u=await api({action:'upload_urls'});if(!u.ok){m.textContent=u.d.error;return}
 for(const k in fs){const fd=new FormData();fd.append('cacheControl','3600');fd.append('',fs[k]);
  const r=await fetch(u.d.urls[k],{method:'PUT',headers:{'x-upsert':'true'},body:fd});if(!r.ok){m.textContent='No se pudo subir: '+D[k];document.getElementById('up').disabled=false;return}}
 const s=await api({action:'submit_docs'});s.ok?load():(m.textContent=s.d.error,document.getElementById('up').disabled=false)}
load();
</script></body></html>
